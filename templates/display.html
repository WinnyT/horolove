<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
          href="https://trmnl.com/css/latest/plugins.css">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <script src="https://trmnl.com/js/latest/plugins.js"></script>
    <title>Celestial Letter</title>
</head>

<body class="environment trmnl">
    <div class="screen">
        <div class="view view--full letter-page">

            <header class="letter-header">
                <div class="brand">
                    <h1>Celestial Letter</h1>
                </div>
                <span class="date">{{ date }}</span>
            </header>

            <main class="letter-body">
                <div class="letter-content">

                    <h2>{{ letter.greeting }}</h2>

                    {% for reading in letter.readings %}
                        <section class="reading">
                            <h3>{{ reading.title }}</h3>
                            <p>{{ reading.message }}</p>
                        </section>
                    {% endfor %}

                    <p class="closing">{{ letter.closing }} ♡</p>
                </div>

                <div class="moon-art">
                    <img src="{{ url_for('static', filename='images/moon.jpg') }}"
                         alt="Crescent moon">
                </div>
            </main>

            <footer class="letter-footer">
                <span>MADE  WITH ❤️ AT HACK CLUB'S TRMNL</span>
            </footer>

        </div>
    </div>
</body>
</html>
